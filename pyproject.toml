[project]
name = "evalguard"
version = "0.1.0"
description = "Automated checks for common machine learning evaluation mistakes"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
